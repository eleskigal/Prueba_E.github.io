name: Frontend QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/export.js
          node --check js/executive-pdf.js
          node --check js/quarter-filter.js
          node --check js/sidebar.js
          node --check js/matrix-table.js
          node --check tests/sidebar-layout-check.js
      - name: Check Python automation syntax
        run: |
          python -m py_compile scripts/procesar_matriz.py
          python -m py_compile scripts/watch_and_publish.py
      - name: Validate sidebar layout regression
        run: node tests/sidebar-layout-check.js
      - name: Validate JSON data
        run: python -m json.tool data/reportes.json > /dev/null
      - name: Validate required application hooks
        shell: bash
        run: |
          set -euo pipefail
          for id in view-resumen view-calendario view-matriz summary-kpis calendar-grid month-agenda buscar trimestre estado responsable instrumento tbody drawer export-toggle export-menu sidebar; do
            grep -q "id=\"$id\"" index.html || { echo "Missing DOM id: $id"; exit 1; }
          done
          grep -q "./css/app.css" index.html
          grep -q "./css/summary.css" index.html
          grep -q "./css/glass.css" index.html
          grep -q "./css/layout-fix.css" index.html
          grep -q "./css/motion.css" index.html
          grep -q "./css/matrix-table.css" index.html
          grep -q "xlsx.full.min.js" index.html
          grep -q "./js/app.js" index.html
          grep -q "./js/quarter-filter.js" index.html
          grep -q "./js/sidebar.js" index.html
          grep -q "./js/export.js" index.html
          grep -q "./js/executive-pdf.js" index.html
          grep -q "./js/matrix-table.js" index.html
          grep -q 'data-export="xlsx"' index.html
          grep -q 'data-export="pdf"' index.html
          grep -q 'data-export="csv"' index.html
          test -s css/glass.css
          test -s css/layout-fix.css
          test -s css/motion.css
          test -s css/matrix-table.css
          test -s js/export.js
          test -s js/executive-pdf.js
          test -s js/quarter-filter.js
          test -s js/sidebar.js
          test -s js/matrix-table.js
          test -s scripts/watch_and_publish.py
          test -s automation/setup_windows.ps1
          test -s automation/start_watcher.ps1
          test -s automation/publish_once.ps1
      - name: Validate matrix resizer hooks
        shell: bash
        run: |
          grep -q "column-resizer" css/matrix-table.css
          grep -q "dcd-matrix-column-widths-v1" js/matrix-table.js
          grep -q "Restablecer columnas" js/matrix-table.js
      - name: Ensure obsolete prototype assets are absent
        shell: bash
        run: |
          test ! -e v2.html
          test ! -e v5.html
          test ! -e css/dashboard.css
          test ! -e css/dashboard-v5.css
